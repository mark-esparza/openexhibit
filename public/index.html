<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenExhibit</title>
<meta name="description" content="Search freely licensed medical images, diagrams and videos.">
<link rel="stylesheet" href="/style.css?v=0.2.0">
<link rel="icon" href="data:,">
</head>
<body class="home">
<div class="page">
  <div class="top">
    <a class="logo" href="/">OpenExhibit</a>
    <form class="search" id="search" role="search" action="/" method="get">
      <input type="text" id="q" name="q" autocomplete="off" spellcheck="false" aria-label="Search">
      <select id="type" name="type" aria-label="Media type">
        <option value="image">Images</option>
        <option value="diagram">Diagrams</option>
        <option value="video">Videos</option>
      </select>
      <button type="submit">Search</button>
    </form>
  </div>

  <div id="view" aria-live="polite"></div>

  <footer>Media from Wikimedia Commons contributors under their own licenses. Not affiliated with the Wikimedia Foundation.</footer>
</div>
<script src="/app.js?v=0.2.0" defer></script>
</body>
</html>
